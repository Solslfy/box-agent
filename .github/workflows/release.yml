name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # Installs and runs third-party code, so it gets no write access.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Stamp version from tag
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3" }
          "__version__ = `"$v`"" | Set-Content -Encoding utf8 box_agent/version.py

      - name: Install (pinned)
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name BoxAgent --icon assets/icon.ico box_agent/__main__.py

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/BoxAgent.exe -Algorithm SHA256).Hash.ToLower()
          "$h  BoxAgent.exe" | Set-Content -NoNewline -Encoding ascii dist/BoxAgent.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/BoxAgent.exe
            dist/BoxAgent.exe.sha256
          if-no-files-found: error

  publish:
    # Only uploads already-built files; runs no project or third-party install code.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/BoxAgent.exe dist/BoxAgent.exe.sha256
          --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
