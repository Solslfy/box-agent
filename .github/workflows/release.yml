name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Stamp version from tag
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3" }
          "__version__ = `"$v`"" | Set-Content -Encoding utf8 box_agent/version.py

      - name: Install
        run: python -m pip install -e .[dev]

      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name BoxAgent --icon assets/icon.ico box_agent/__main__.py

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/BoxAgent.exe -Algorithm SHA256).Hash.ToLower()
          "$h  BoxAgent.exe" | Set-Content -NoNewline -Encoding ascii dist/BoxAgent.exe.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BoxAgent.exe
            dist/BoxAgent.exe.sha256
          generate_release_notes: true
