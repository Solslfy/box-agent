[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "box-agent"
dynamic = ["version"]
description = "Drag a box over anything on your PC; an AI sees it, solves it, and clicks/types inside it."
requires-python = ">=3.13"
dependencies = [
    "PySide6",
    "mss",
    "Pillow",
    "pynput",
    "httpx",
    "keyring",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
box-agent = "box_agent.app:main"

[tool.setuptools]
packages = ["box_agent"]

[tool.setuptools.dynamic]
version = { attr = "box_agent.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
